name: C++ CI

on:
  push:
    branches:
      - "testing-CI/CD"
      - main

  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja


      - name: Check MySQL
        shell: pwsh
        run: |
                $mysql = Get-Command mysql.exe -ErrorAction SilentlyContinue

                if (-not $mysql) {
                    throw "mysql.exe was not found"
                }

                mysql --version

                Get-Service |
                Where-Object { $_.Name -match "mysql" } |
                Select-Object Name, Status


      - name: Start MySQL and load test database
        shell: pwsh
        run: |
            $mysqld = "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysqld.exe"
            $mysql = "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe"

            $dataDir = "$env:RUNNER_TEMP\mysql-data"

            New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

            Write-Host "Initializing MySQL..."
            & $mysqld --initialize-insecure --datadir="$dataDir" --console

            Write-Host "Starting MySQL server..."

            $server = Start-Process $mysqld `
                -ArgumentList @(
                    "--datadir=$dataDir",
                    "--port=3306",
                    "--console"
                ) `
                -NoNewWindow `
                -PassThru

            Write-Host "Waiting for MySQL..."

            for ($i = 1; $i -le 30; $i++) {

                & $mysql -u root --skip-password -e "SELECT 1;" 2>$null

                if ($LASTEXITCODE -eq 0) {
                    Write-Host "MySQL is ready!"
                    break
                }

                Start-Sleep -Seconds 1
            }

            if ($LASTEXITCODE -ne 0) {
                throw "MySQL did not start"
            }

            Write-Host "Loading test database..."

            Get-Content "database/tests/ci_test_database.sql" -Raw |
                & $mysql -u root --skip-password

            if ($LASTEXITCODE -ne 0) {
                throw "Failed to load test database"
            }

            Write-Host "Test database loaded successfully"  
            
            
      - name: Find MySQL
        shell: pwsh
        run: |
          $header = Get-ChildItem `
            "C:\Program Files\MySQL" `
            -Filter mysql.h `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $header) {
            throw "mysql.h was not found"
          }

          $mysqlRoot = $header.Directory.Parent.FullName

          Write-Host "MySQL found at: $mysqlRoot"

          "MYSQL_DIR=$mysqlRoot" >> $env:GITHUB_ENV

      - name: Create CI database config
        shell: pwsh
        run: |
          @"
          #pragma once

          #include <string>

          using namespace std;

          const string DB_HOST = "localhost";
          const string DB_USER = "root";
          const string DB_PASSWORD = "";
          const string DB_NAME = "campus_managment";
          "@ | Set-Content include/db_config.hpp

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DMYSQL_DIR="$env:MYSQL_DIR"

      - name: Build project
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Run tests
        shell: msys2 {0}
        run: |
            ./build/Test_app.exe